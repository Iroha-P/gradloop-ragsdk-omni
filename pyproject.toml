[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gradloop-ragsdk-agent"
version = "0.1.0.dev0"
description = "Privacy-first RAG and learning agent for recommendation-based postgraduate admission preparation."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "langgraph>=1.0,<2.0",
  "langgraph-checkpoint-sqlite>=3.0,<4.0",
  "pydantic>=2.11,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
evaluation = [
  "scikit-learn>=1.5,<2.0",
]
ingestion = [
  "pypdf>=5.0,<7.0",
  "python-docx>=1.1,<2.0",
]
realtime = [
  "websockets>=15,<16",
]
dev = [
  "coverage[toml]>=7.6,<8.0",
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.11,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "ragsdk: requires a supported Linux Python 3.11 RAGSDK runtime",
  "integration: exercises more than one application boundary",
  "privacy: privacy and security regression tests",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["RUF001"] # Chinese user-facing text and privacy regexes intentionally use full-width punctuation.

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"] # Standalone scripts bootstrap PROJECT_ROOT before importing app modules.
